
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story 1 - Alerta Escolar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101D35;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .story {
            width: 360px;
            height: 640px;
            max-width: 100%;
            padding: 30px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background:
                radial-gradient(circle at top right, #2456a0 0, transparent 45%),
                linear-gradient(145deg, #174EA6, #101D35 75%);
        }

        .linha {
            width: 55px;
            height: 5px;
            border-radius: 10px;
            background: #F5B700;
            margin-bottom: 28px;
        }

        .logo {
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .icone {
            font-size: 75px;
            margin: 35px 0 20px;
        }

        h1 {
            font-size: 34px;
            line-height: 1.2;
            margin: 10px 0;
        }

        .descricao {
            font-size: 18px;
            line-height: 1.5;
            color: #DCE8FA;
            margin: 15px 0 25px;
        }

        .pergunta {
            width: 100%;
            padding: 18px;
            border: 1px solid #F5B700;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: #F5B700;
            font-size: 19px;
            font-weight: bold;
        }

        .rodape {
            position: absolute;
            bottom: 22px;
            font-size: 12px;
            letter-spacing: 1px;
            color: #C5D5EE;
        }

        .destaque {
            color: #F5B700;
        }
    </style>
</head>

<body>

    <main class="story">

        <div class="linha"></div>

        <div class="logo">⚠ ALERTA ESCOLAR</div>

        <div class="icone">🏫</div>

        <h1>
            JÁ ENCONTROU<br>
            ALGO <span class="destaque">QUEBRADO</span><br>
            NA ESCOLA?
        </h1>

        <p class="descricao">
            Uma carteira danificada ou um equipamento com defeito?
        </p>

        <div class="pergunta">
            VOCÊ SABERIA A QUEM AVISAR?
        </div>

        <div class="rodape">
            SUA VOZ PODE MELHORAR A ESCOLA
        </div>

    </main>

</body>
</html>
