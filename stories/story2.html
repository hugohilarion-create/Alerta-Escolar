
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story 2 - Alerta Escolar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #101D35;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .story {
            width: 360px;
            height: 640px;
            max-width: 100%;
            padding: 25px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;

            background:
                radial-gradient(circle at top right, #2456a0 0, transparent 45%),
                linear-gradient(145deg, #174EA6, #101D35 75%);
        }

        .linha {
            width: 55px;
            height: 5px;
            border-radius: 10px;
            background: #F5B700;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .icone {
            font-size: 65px;
            margin: 20px 0 10px;
        }

        h1 {
            font-size: 32px;
            line-height: 1.15;
            margin: 8px 0;
        }

        .descricao {
            font-size: 16px;
            line-height: 1.4;
            color: #DCE8FA;
            margin: 10px 0 15px;
        }

        .qrcode {
            width: 115px;
            height: 115px;
            padding: 6px;
            background: white;
            border-radius: 12px;
            object-fit: contain;
        }

        .botao {
            background: #F5B700;
            color: #172B4D;
            padding: 13px 25px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            width: 100%;
            margin-top: 12px;
        }

        .instrucao {
            font-size: 13px;
            color: #DCE8FA;
            margin-top: 8px;
        }

        .rodape {
            position: absolute;
            bottom: 15px;
            font-size: 11px;
            letter-spacing: 1px;
            color: #C5D5EE;
        }

        .destaque {
            color: #F5B700;
        }
    </style>
</head>

<body>

    <main class="story">

        <div class="linha"></div>

        <div class="logo">⚠ ALERTA ESCOLAR</div>

        <div class="icone">📱</div>

        <h1>
            SUA ESCOLA<br>
            PODE <span class="destaque">MELHORAR!</span>
        </h1>

        <p class="descricao">
            Ajude a transformar problemas em soluções.
            Comunique, acompanhe e participe.
        </p>

        <img
            src="../qr-alerta-escolar.png"
            alt="QR Code para acessar o Alerta Escolar"
            class="qrcode"
        >

        <div class="botao">
            TESTE AGORA
        </div>

        <p class="instrucao">
            Escaneie o QR Code e conheça a plataforma.
        </p>

        <div class="rodape">
            SUA PARTICIPAÇÃO FAZ A DIFERENÇA
        </div>

    </main>

</body>
</html>
