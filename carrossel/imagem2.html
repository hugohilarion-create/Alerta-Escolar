
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel - Passo 2</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #13875b;
            color: white;
        }

        .imagem {
            width: 540px;
            height: 675px;
            max-width: 100%;
            margin: 20px auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .numero {
            color: #ffcc33;
            font-size: 24px;
            font-weight: bold;
        }

        .icone {
            font-size: 110px;
            margin: 30px 0;
        }

        h1 {
            font-size: 42px;
        }

        p {
            font-size: 25px;
            line-height: 1.5;
        }

        .destaque {
            color: #ffcc33;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="imagem">
        <div class="numero">PASSO 2 DE 3</div>

        <div class="icone">📝</div>

        <h1>INFORME O PROBLEMA</h1>

        <p>
            Descreva o que aconteceu e indique
            o local onde encontrou o problema.
        </p>

        <p class="destaque">
            Seja claro nas informações!
        </p>
    </div>

</body>
</html>
