
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta Escolar - Administração</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #173b63;
        }

        header {
            background: #173b63;
            color: white;
            padding: 25px;
            text-align: center;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        h2 {
            margin-top: 30px;
        }

        .resumo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .resumo-card {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000012;
            text-align: center;
        }

        .resumo-card h3 {
            font-size: 30px;
            margin: 10px 0;
        }

        .resumo-card p {
            margin: 0;
            color: #64748b;
        }

        .topo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            background: #2878c8;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #173b63;
        }

        form {
            background: white;
            padding: 22px;
            border-radius: 12px;
            margin: 20px 0;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 85px;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .cancelar {
            background: #64748b;
        }

        #ocorrencias {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000012;
        }

        .card h3 {
            margin-top: 0;
        }

        .card select {
            margin-top: 8px;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #dbeafe;
            color: #1d4ed8;
            font-size: 13px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        [hidden] {
            display: none !important;
        }

/* RESPONSIVIDADE PARA CELULARES */

@media (max-width: 600px) {

    header {
        padding: 20px 10px;
    }

    header h1 {
        font-size: 24px;
    }

    main {
        margin: 10px auto;
        padding: 12px;
    }

    .resumo {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .resumo-card {
        padding: 15px 8px;
    }

    .resumo-card h3 {
        font-size: 25px;
    }

    .topo {
        align-items: stretch;
        flex-direction: column;
    }

    .topo button {
        width: 100%;
    }

    #ocorrencias {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 18px;
    }

    form {
        padding: 15px;
    }

    .botoes {
        flex-direction: column;
    }

    .botoes button {
        width: 100%;
    }
}

    </style>
</head>

<body>

<header>
    <h1>🚨 Alerta Escolar</h1>
    <p>Painel administrativo</p>
</header>

<main>

    <h2>Resumo das ocorrências</h2>

    <section class="resumo">
        <div class="resumo-card">
            <p>Total de ocorrências</p>
            <h3 id="total">0</h3>
        </div>

        <div class="resumo-card">
            <p>Pendentes</p>
            <h3 id="pendentes">0</h3>
        </div>

        <div class="resumo-card">
            <p>Em andamento</p>
            <h3 id="andamento">0</h3>
        </div>

        <div class="resumo-card">
            <p>Resolvidas</p>
            <h3 id="resolvidas">0</h3>
        </div>
    </section>

    <div class="topo">
        <h2>Gerenciar ocorrências</h2>
        <button id="abrirFormulario">+ Nova ocorrência</button>
    </div>

    <form id="formulario" hidden>

        <h2>Registrar problema</h2>

        <label for="objeto">Nome do objeto:</label>
        <input id="objeto" required placeholder="Ex: Ventilador">

        <label for="categoria">Tipo de problema:</label>
        <select id="categoria" required>
            <option value="">Selecione</option>
            <option>Quebrado</option>
            <option>Com defeito</option>
            <option>Faltando</option>
        </select>

        <label for="local">Local:</label>
        <input id="local" required placeholder="Ex: Sala 12">

        <label for="descricao">Descrição:</label>
        <textarea id="descricao" required></textarea>

        <label for="responsavel">Seu nome:</label>
        <input id="responsavel" required>

        <div class="botoes">
            <button type="submit">Registrar</button>
            <button type="button" class="cancelar"
                id="cancelar">Cancelar</button>
        </div>

    </form>

    <div id="ocorrencias">
        Carregando...
    </div>

</main>

<footer>
    Projeto Integrador DEV 2026 - SENAI
</footer>

<script>

    const container = document.getElementById("ocorrencias");
    const formulario = document.getElementById("formulario");

    let ocorrencias = [];

    async function carregarOcorrencias() {

        try {
            const resposta = await fetch("dados.json");

            if (!resposta.ok) {
                throw new Error("Erro ao carregar dados");
            }

            const dados = await resposta.json();

            const salvas = localStorage.getItem("ocorrencias");

            ocorrencias = salvas
                ? JSON.parse(salvas)
                : dados.ocorrencias;

            mostrarOcorrencias();

        } catch (erro) {
            container.textContent = "Erro ao carregar as ocorrências.";
            console.error(erro);
        }
    }

    function salvarDados() {
        localStorage.setItem(
            "ocorrencias",
            JSON.stringify(ocorrencias)
        );
    }

    function atualizarResumo() {

        document.getElementById("total").textContent =
            ocorrencias.length;

        document.getElementById("pendentes").textContent =
            ocorrencias.filter(item =>
                item.situacao === "Pendente"
            ).length;

        document.getElementById("andamento").textContent =
            ocorrencias.filter(item =>
                item.situacao === "Em andamento"
            ).length;

        document.getElementById("resolvidas").textContent =
            ocorrencias.filter(item =>
                item.situacao === "Resolvido"
            ).length;
    }

    function mostrarOcorrencias() {

        container.innerHTML = "";

        ocorrencias.forEach(item => {

            const card = document.createElement("div");
            card.className = "card";

            const titulo = document.createElement("h3");
            titulo.textContent = item.objeto;

            const categoria = document.createElement("p");
            categoria.textContent = item.categoria;

            const local = document.createElement("p");
            local.textContent = "Local: " + item.local;

            const descricao = document.createElement("p");
            descricao.textContent = "Descrição: " + item.descricao;

            const responsavel = document.createElement("p");
            responsavel.textContent =
                "Responsável: " + item.responsavel;

            const status = document.createElement("span");
            status.className = "status";
            status.textContent = item.situacao;

            const label = document.createElement("label");
            label.textContent = "Atualizar situação:";

            const select = document.createElement("select");

            ["Pendente", "Em andamento", "Resolvido"]
                .forEach(opcao => {
                    const option = document.createElement("option");
                    option.value = opcao;
                    option.textContent = opcao;
                    select.appendChild(option);
                });

            select.value = item.situacao;

            select.addEventListener("change", () => {

                item.situacao = select.value;

                salvarDados();
                mostrarOcorrencias();

            });

            card.append(
                titulo,
                categoria,
                local,
                descricao,
                responsavel,
                status,
                label,
                select
            );

            container.appendChild(card);

        });

        atualizarResumo();
    }

    document.getElementById("abrirFormulario")
        .addEventListener("click", () => {
            formulario.hidden = false;
        });

    document.getElementById("cancelar")
        .addEventListener("click", () => {
            formulario.reset();
            formulario.hidden = true;
        });

    formulario.addEventListener("submit", evento => {

        evento.preventDefault();

        const novaOcorrencia = {
            id: Date.now(),
            objeto: document.getElementById("objeto").value,
            categoria: document.getElementById("categoria").value,
            local: document.getElementById("local").value,
            descricao: document.getElementById("descricao").value,
            responsavel: document.getElementById("responsavel").value,
            situacao: "Pendente",
            data: new Date().toISOString().slice(0, 10)
        };

        ocorrencias.unshift(novaOcorrencia);

        salvarDados();
        mostrarOcorrencias();

        formulario.reset();
        formulario.hidden = true;

        alert("Ocorrência registrada com sucesso!");

    });

    carregarOcorrencias();

</script>

</body>
</html>
